<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>สังเวียนเลือด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Sarabun:wght@400;700;800&display=swap">
<meta name="description" content="เกม MMA แซนด์บ็อกซ์บนเว็บ ตัวละครเหลี่ยม วาดหน้าเองได้ ระบบเลือดและอาการบาดเจ็บสมจริง โหมดอาชีพพร้อมเนื้อเรื่อง">
<style>:root {
  color-scheme: dark;
  --display: "Kanit", "Sarabun", "Noto Sans Thai", Tahoma, sans-serif;
  --bg: #0b0b0e; --panel: rgba(16,16,20,0.92); --panel2: #18181e; --line: #2b2b33; --text: #e9e6e1; --muted: #9a958e;
  --red: #c41e1e; --red2: #ff3b3b; --blue: #2457c5; --blue2: #4d86ff; --gold: #d4a52c; --blood: #8a0a0e; --ok: #3fae5a;
  --font: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Thonburi", Tahoma, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { .hud-msg, .feed-line, .btn { transition: none !important; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
#app { position: fixed; inset: 0; }
#view3d { position: absolute; inset: 0; }
.game-canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
button { font-family: var(--font); }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none !important; }
.hud * { pointer-events: none; }
.hud-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: stretch; width: min(980px, 96vw); }
.hud-fighter { flex: 1; background: linear-gradient(180deg, rgba(10,10,12,.85), rgba(10,10,12,.6)); padding: 6px 10px; border-radius: 4px; min-width: 0; }
.hud-fighter.red { border-left: 4px solid var(--red); }
.hud-fighter.blue { border-right: 4px solid var(--blue); text-align: right; }
.hf-name { font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .5px; }
.hf-name .nick { font-weight: 400; color: var(--muted); font-size: 13px; text-transform: none; }
.hf-rec { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: #222; margin-top: 4px; border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: #3fa0e0; transition: width .2s; }
.hud-fighter.blue .bar .fill { margin-left: auto; }
.bar.cond { height: 4px; }
.hud-clock { background: rgba(10,10,12,.88); padding: 6px 14px; border-radius: 4px; text-align: center; min-width: 110px; }
.hud-clock .rnd { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
.hud-clock .time { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-msg { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 48px; font-weight: 800; letter-spacing: 3px; opacity: 0; transition: opacity .25s, transform .25s; transform: scale(.9); text-shadow: 0 4px 20px #000, 0 0 2px #000; }
.hud-msg.show { opacity: 1; transform: scale(1); }
.hud-msg.ko { color: var(--red2); font-size: 84px; }
.hud-msg.warn { color: #ffb020; }
.hud-msg.info { color: #8fd0ff; font-size: 34px; }
.hud-msg.big { font-size: 40px; }
.hud-msg.replay { font-size: 22px; top: 12%; color: #fff; letter-spacing: 6px; }
.hud-feed { position: absolute; left: 14px; bottom: 60px; width: min(520px, 70vw); display: flex; flex-direction: column; gap: 4px; }
.feed-line { background: rgba(8,8,10,.72); padding: 5px 10px; border-radius: 3px; font-size: 14px; border-left: 3px solid #555; transition: opacity 1.5s; }
.feed-line.fade { opacity: 0; }
.feed-line.hot { border-color: var(--red2); }
.feed-line.blood { border-color: var(--blood); color: #ffb3b3; }
.feed-line.warn { border-color: #ffb020; }
.feed-line.info { border-color: #4d86ff; }
.feed-line b.red { color: #ff6b6b; } .feed-line b.blue { color: #7aa8ff; }
.hud-pos { position: absolute; right: 14px; bottom: 60px; background: rgba(8,8,10,.8); padding: 8px 12px; border-radius: 4px; font-size: 14px; max-width: 360px; text-align: right; }
.hud-pos span { color: var(--muted); font-size: 12px; }
.hud-pos .att { color: #ffcf6a; margin-top: 4px; }
.hud-sub { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 360px; background: rgba(8,8,10,.85); padding: 10px; border-radius: 5px; text-align: center; }
.sub-name { font-weight: 800; color: #ffcf6a; }
.sub-bar { height: 12px; background: #222; margin: 8px 0; border-radius: 6px; overflow: hidden; }
.sub-fill { height: 100%; background: linear-gradient(90deg, #e0a020, #d02020); }
.sub-hint { font-size: 13px; color: var(--muted); }
.hud-keys { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(8,8,10,.82); border: 1px solid #333; padding: 8px 14px; border-radius: 6px; font-size: 13px; text-align: center; line-height: 1.7; width: min(880px, 94vw); }
.hud-keys b { background: #26262f; border: 1px solid #444; border-radius: 3px; padding: 0 5px; font-weight: 700; }
.hud-hint { position: absolute; bottom: 10px; right: 14px; font-size: 12px; color: rgba(255,255,255,.4); }
.vis { position: absolute; top: 0; bottom: 0; width: 60%; opacity: 0; transition: opacity .4s; }
.vis-l { left: 0; background: radial-gradient(ellipse at 0% 50%, rgba(20,5,12,1) 30%, rgba(20,5,12,.8) 55%, rgba(20,5,12,0) 80%); }
.vis-r { right: 0; background: radial-gradient(ellipse at 100% 50%, rgba(20,5,12,1) 30%, rgba(20,5,12,.8) 55%, rgba(20,5,12,0) 80%); }
.blood-l { left: 0; background: radial-gradient(ellipse at 10% 20%, rgba(120,0,0,.95), rgba(100,0,0,.55) 45%, rgba(90,0,0,0) 75%); filter: blur(2px); }
.blood-r { right: 0; background: radial-gradient(ellipse at 90% 20%, rgba(120,0,0,.95), rgba(100,0,0,.55) 45%, rgba(90,0,0,0) 75%); filter: blur(2px); }
.vis.hurt { width: 100%; left: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(40,0,0,.85) 100%); }
.hud.rocked ~ * {}
.hud-dmg { position: absolute; left: 14px; top: 90px; width: 250px; background: rgba(8,8,10,.88); padding: 10px; border-radius: 5px; font-size: 13px; }
.dmg-title { font-weight: 800; margin-bottom: 6px; }
.bodymap { width: 90px; float: left; margin-right: 10px; }
.dmg-stats { color: var(--muted); font-size: 12px; }
.hud-dmg ul { clear: both; margin: 8px 0 0; padding-left: 18px; }
.hud-dmg li { color: #ffb3b3; }

/* ---------- Menus ---------- */
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: auto; }
.screen.modal { z-index: 50; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.screen.dim { background: rgba(10,10,14,.55); backdrop-filter: blur(1px); }
.screen.solid { background: radial-gradient(ellipse at top, #1a1012 0%, #08080a 70%); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; max-width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.title-logo { font-family: var(--display); font-size: clamp(42px, 9vw, 96px); font-weight: 800; letter-spacing: 2px; line-height: .95; text-align: center; color: #f1ede6; text-shadow: 0 6px 30px rgba(140,0,0,.6); }
.title-logo .en { display: block; font-size: .32em; letter-spacing: 12px; color: var(--red2); margin-top: 6px; }
.title-sub { text-align: center; color: var(--muted); margin: 10px 0 24px; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(380px, 90vw); margin: 0 auto; }
.btn { background: #1d1d24; color: var(--text); border: 1px solid #34343e; padding: 12px 16px; border-radius: 5px; font-size: 16px; cursor: pointer; text-align: left; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: #26262f; border-color: var(--red); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #b31b1b, #7d1010); border-color: #d23b3b; font-weight: 800; }
.btn.primary:hover { background: linear-gradient(180deg, #c92424, #8f1414); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .desc { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
h2 { margin: 0 0 12px; font-size: 24px; font-family: var(--display); font-weight: 600; text-wrap: balance; }
h3 { margin: 14px 0 8px; font-size: 16px; color: #f0c0a0; }
label { font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], select { background: #121217; color: var(--text); border: 1px solid #34343e; padding: 8px 10px; border-radius: 4px; font-family: var(--font); font-size: 15px; width: 100%; }
input[type=range] { width: 100%; accent-color: var(--red); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
.swatch.sel { border-color: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 10px; border-radius: 14px; background: #1d1d24; border: 1px solid #34343e; cursor: pointer; font-size: 13px; }
.chip.sel { background: var(--red); border-color: var(--red2); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { padding: 8px 14px; background: #16161b; border: 1px solid #2b2b33; border-radius: 5px 5px 0 0; cursor: pointer; }
.tab.sel { background: #2a1416; border-color: var(--red); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.creator { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr); gap: 16px; width: min(1180px, 100%); max-height: calc(100vh - 32px); }
.creator .left, .creator .right { overflow: auto; max-height: calc(100vh - 80px); }
.face-editor { display: flex; gap: 12px; flex-wrap: wrap; }
.face-canvas-wrap { position: relative; width: 320px; height: 400px; background: #222; border: 1px solid #444; touch-action: none; flex: 0 0 auto; }
.face-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.tools { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.preview3d { width: 100%; height: 300px; background: #111; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
.attr-row { display: grid; grid-template-columns: 1fr 40px 28px 28px; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 14px; }
.attr-row .val { text-align: center; font-weight: 800; }
.attr-bar { height: 4px; background: #222; border-radius: 2px; overflow: hidden; grid-column: 1 / -1; margin-top: -2px; }
.attr-bar div { height: 100%; background: var(--red); }

/* career */
.career { width: min(1200px, 100%); display: grid; grid-template-columns: 300px 1fr; gap: 14px; max-height: calc(100vh - 32px); }
.career .side { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.career .main { overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
.card h3 { margin-top: 0; }
.stat-grid { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.stat-grid .k { color: var(--muted); }
.offer { border: 1px solid #3a2a2a; background: #1b1314; padding: 10px; border-radius: 5px; margin-bottom: 8px; }
.offer .vs { font-weight: 800; font-size: 16px; }
.activity { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.activity .btn { min-height: 64px; }
.activity .btn.sel { border-color: var(--gold); background: #2a2414; }
.rank-list { font-size: 13px; max-height: 340px; overflow: auto; }
.rank-list div { padding: 3px 4px; border-bottom: 1px solid #222; display: flex; gap: 8px; }
.rank-list .me { background: #3a1416; font-weight: 800; }
.inbox-item { padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
.inbox-item.new { border-left: 3px solid var(--gold); }
.story { width: min(760px, 100%); }
.story .speaker { font-weight: 800; color: #f0c0a0; margin-bottom: 4px; }
.story .text { font-size: 18px; line-height: 1.6; white-space: pre-line; }
.story .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.story .scene-img { height: 140px; border-radius: 6px; margin-bottom: 14px; background: linear-gradient(135deg, #2a0d0f, #0c0c10); display: flex; align-items: center; justify-content: center; font-size: 46px; }
.result-big { font-family: var(--display); font-size: 44px; font-weight: 800; text-align: center; }
.result-big.win { color: var(--gold); } .result-big.loss { color: var(--red2); }
table.cards { border-collapse: collapse; width: 100%; font-size: 14px; }
table.cards td, table.cards th { border-bottom: 1px solid #2a2a2a; padding: 4px 6px; text-align: center; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; font-size: 14px; }
.help-grid kbd { background: #26262f; border: 1px solid #444; border-radius: 3px; padding: 1px 6px; font-family: monospace; font-size: 12px; }
.sandbox-panel { position: absolute; top: 90px; right: 10px; width: 290px; z-index: 25; max-height: calc(100vh - 110px); overflow: auto; background: rgba(12,12,16,.9); border: 1px solid #333; border-radius: 6px; padding: 10px; font-size: 13px; pointer-events: auto; }
.sandbox-panel h3 { margin: 6px 0; }
.sandbox-panel .btn { padding: 6px 8px; font-size: 13px; }
.toast { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d1d24; border: 1px solid var(--gold); padding: 10px 16px; border-radius: 5px; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #08080a; font-size: 20px; color: var(--muted); }
@media (max-width: 860px) {
  .creator, .career { grid-template-columns: 1fr; }
  .hud-msg { font-size: 30px; } .hud-msg.ko { font-size: 48px; }
  .face-canvas-wrap { width: 256px; height: 320px; }
}

/* ---------- Icons ---------- */
.ico { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.ico svg { display: block; }

/* ---------- Touch controls ---------- */
.touch { position: absolute; inset: 0; pointer-events: none !important; user-select: none; -webkit-user-select: none; touch-action: none; z-index: 20; }
.touch > * { pointer-events: auto; }
.tzone { position: absolute; left: 0; bottom: 0; width: 42vw; height: 62vh; touch-action: none; }
.tstick { position: absolute; left: max(28px, env(safe-area-inset-left, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.22); }
.tknob { position: absolute; left: 36px; top: 36px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.5); }
.tbtn { width: 58px; height: 58px; border-radius: 50%; background: rgba(14,14,18,.62); border: 2px solid rgba(255,255,255,.28); color: #f2efe9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; touch-action: none; }
.tbtn .tlbl { font-size: 9px; line-height: 1; opacity: .85; white-space: nowrap; }
.tbtn.on { background: rgba(196,30,30,.75); border-color: #ff6b6b; transform: scale(.94); }
.tbtn.big { width: 70px; height: 70px; }
.tbtn.sm { width: 46px; height: 46px; }
.tbtn.sm .tlbl { font-size: 8px; }
.tbtn.guard { background: rgba(36,87,197,.55); }
.tbtn.tog.on { background: rgba(212,165,44,.8); border-color: #ffd36a; color: #111; }
.tbtn.huge { width: 120px; height: 120px; background: rgba(196,30,30,.7); }
.tbtn.huge .tlbl { font-size: 12px; }
.tpad { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.trow { display: flex; gap: 6px; align-items: center; }
.tside { position: absolute; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 236px); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }
.tgrap { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 268px); display: flex; gap: 6px; }
.ttop { position: absolute; top: calc(max(8px, env(safe-area-inset-top, 0px)) + 84px); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; }
.tmash { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); }
.touch.ground .tside .tog { opacity: .35; }
.rotate-hint { display: none; }
@media (orientation: portrait) {
  .touch .rotate-hint { display: flex; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(8,8,10,.85); padding: 12px 16px; border-radius: 8px; gap: 10px; align-items: center; font-size: 14px; pointer-events: none; }
  .tzone { height: 45vh; width: 50vw; }
  .tside { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 330px); flex-direction: row; flex-wrap: wrap; width: 210px; justify-content: flex-end; }
  .tgrap { bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 268px); }
}
/* HUD layout when touch controls are on: keep the bottom corners free for thumbs */
.touchmode .hud-feed { bottom: auto; top: 138px; left: 10px; width: min(380px, 40vw); }
.touchmode .feed-line { font-size: 12px; padding: 3px 8px; }
.touchmode .hud-pos { bottom: auto; top: 140px; right: 10px; font-size: 12px; max-width: 46vw; }
.touchmode .hud-hint { display: none; }
.touchmode .hud-keys { bottom: auto; top: 40%; font-size: 12px; }
@media (max-width: 760px), (max-height: 500px) {
  .hud-top { top: 4px; gap: 4px; }
  .hf-name { font-size: 12px; } .hf-rec { font-size: 10px; } .hud-clock .time { font-size: 18px; } .hud-clock { min-width: 72px; padding: 4px 6px; }
  .hud-msg { font-size: 26px; } .hud-msg.ko { font-size: 40px; }
  .touchmode .hud-feed { top: 100px; }
  .hud-dmg { top: 64px; width: 220px; font-size: 11px; }
  .panel { padding: 14px; }
  h2 { font-size: 20px; }
  .btn { padding: 10px 12px; font-size: 15px; }
}

/* ---------- Picture tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: min(720px, 100%); margin: 0 auto; }
.tile { background: #1d1d24; border: 1px solid #34343e; border-radius: 10px; padding: 14px 10px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--text); font-family: var(--font); font-size: 15px; transition: background .15s, border-color .15s, transform .05s; }
.tile:hover { background: #26262f; border-color: var(--red); }
.tile:active { transform: translateY(1px); }
.tile .pic { font-size: 40px; line-height: 1.1; }
.tile .pic.svg { color: #f0c0a0; }
.tile .sub { font-size: 11px; color: var(--muted); }
.tile.primary { background: linear-gradient(180deg, #b31b1b, #7d1010); border-color: #d23b3b; font-weight: 800; }
.tile.primary .sub { color: #ffd9d9; }
.tile.sel { border-color: var(--gold); background: #2a2414; }
.tile.small { padding: 8px 6px; font-size: 12px; }
.tile.small .pic { font-size: 28px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.thumb { background: #16161b; border: 2px solid #2b2b33; border-radius: 8px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.thumb canvas { width: 64px; height: 64px; image-rendering: pixelated; }
.thumb.sel { border-color: var(--gold); color: var(--text); }
.iconbar { display: flex; gap: 6px; flex-wrap: wrap; }
.iconbtn { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 10px; min-width: 64px; background: #1d1d24; border: 1px solid #34343e; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 11px; font-family: var(--font); }
.iconbtn .pic { font-size: 24px; line-height: 1; }
.iconbtn:hover { border-color: var(--red); }
.iconbtn.sel { border-color: var(--gold); background: #2a2414; }
.fs-btn { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 5; }
.sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sb-grid .iconbtn { min-width: 0; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tile .pic { font-size: 34px; } .tile .sub { display: none; } .sandbox-panel { width: 220px; top: 70px; max-height: 50vh; } }

.help-row { display: grid; grid-template-columns: 26px auto 1fr; gap: 8px; align-items: center; padding: 3px 0; }
.help-row .ico { color: #f0c0a0; }
.help-row .keys { white-space: nowrap; }

.creator .left.peek > *:not(.row) { display: none; }
.creator .left.peek { background: rgba(16,16,20,.6); align-self: end; }
.screen > .panel { max-height: calc(100vh - 32px); overflow: auto; }
@media (max-width: 860px) { .creator > .right { display: none; } .creator .left { max-height: calc(100vh - 32px); } }
@media (max-width: 860px) { .screen > .panel[style*="bottom"] { display: none; } }

.sb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sb-title { margin: 8px 0 4px; font-size: 12px; color: #f0c0a0; font-weight: 700; }
.sandbox-panel .iconbtn { padding: 6px 4px; font-size: 10px; }
.sandbox-panel .iconbtn .pic { font-size: 20px; }
.sandbox-panel.min { width: auto; }
.sandbox-panel.min .sb-body, .sandbox-panel.min .sb-head b { display: none; }
.touchmode .sandbox-panel { top: auto; bottom: auto; top: 64px; left: 10px; right: auto; max-height: 60vh; }

.menu-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none !important; }
.menu-layer > * { pointer-events: auto; }
.menu-open .touch { display: none; }
.screen.modal { z-index: 60; }

/* short landscape phones: compact touch layout */
@media (max-height: 500px) {
  .tbtn { width: 44px; height: 44px; } .tbtn.big { width: 54px; height: 54px; } .tbtn.sm { width: 36px; height: 36px; }
  .tbtn .tlbl { font-size: 8px; } .tbtn .ico svg { width: 20px; height: 20px; }
  .tpad { gap: 4px; right: max(8px, env(safe-area-inset-right, 0px)); bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
  .trow { gap: 4px; }
  .tside { gap: 4px; right: calc(max(8px, env(safe-area-inset-right, 0px)) + 180px); bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
  .ttop { top: calc(max(4px, env(safe-area-inset-top, 0px)) + 56px); }
  .tstick { width: 112px; height: 112px; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
  .tknob { left: 28px; top: 28px; width: 52px; height: 52px; }
  .touchmode .hud-feed { top: 100px; width: 34vw; }
  .touchmode .hud-pos { top: 56px; right: auto; left: 50%; transform: translateX(-50%); max-width: 40vw; text-align: center; }
  .touchmode .hud-sub { top: 30%; }
  .tiles { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tile { padding: 8px 6px; font-size: 13px; } .tile .pic { font-size: 26px; } .tile .sub { display: none; }
  .title-logo { font-size: 38px; } .title-logo .en { font-size: 14px; letter-spacing: 8px; } .title-sub { margin: 4px 0 10px; font-size: 12px; }
}

/* simple touch layout */
.teasy { display: none; position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 10px; align-items: flex-end; }
.touch.simple .teasy { display: flex; }
.touch.simple .tpad, .touch.simple .tside { display: none; }
.erow { display: flex; gap: 10px; align-items: flex-end; }
.tbtn.emid { width: 66px; height: 66px; }
.tbtn.ebig { width: 82px; height: 82px; }
.tbtn.ehuge { width: 104px; height: 104px; }
.tbtn.ehuge .ico svg { width: 40px; height: 40px; } .tbtn.ebig .ico svg { width: 32px; height: 32px; }
.tbtn.ehuge .tlbl, .tbtn.ebig .tlbl, .tbtn.emid .tlbl { font-size: 12px; font-weight: 700; }
.tbtn.punch { background: rgba(196,30,30,.7); border-color: #ff8080; }
.tbtn.kickb { background: rgba(212,120,30,.65); border-color: #ffc070; }
.tbtn.grab { background: rgba(40,140,90,.6); border-color: #7fe0b0; }
@media (max-height: 500px) {
  .teasy { gap: 6px; } .erow { gap: 8px; }
  .tbtn.emid { width: 54px; height: 54px; } .tbtn.ebig { width: 66px; height: 66px; } .tbtn.ehuge { width: 84px; height: 84px; }
  .tbtn.ehuge .ico svg { width: 32px; height: 32px; } .tbtn.ebig .ico svg { width: 26px; height: 26px; }
}

.barrow { display: flex; align-items: center; gap: 4px; }
.hud-fighter.blue .barrow { flex-direction: row-reverse; }
.barrow .bar { flex: 1; }
.barrow .bi { font-size: 10px; line-height: 1; width: 14px; text-align: center; margin-top: 4px; }
.hud-tip { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); background: rgba(20,14,6,.85); border: 1px solid var(--gold); color: #ffe7b0; padding: 7px 14px; border-radius: 20px; font-size: 15px; font-weight: 700; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
@media (max-height: 500px), (max-width: 760px) { .hud-tip { top: 58px; font-size: 12px; padding: 4px 10px; } }
.tut { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 26; background: rgba(12,12,16,.92); border: 2px solid var(--gold); border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; gap: 14px; width: min(620px, 94vw); pointer-events: auto; }
.tut .pic { font-size: 44px; }
.tut .tt { font-size: 18px; font-weight: 800; }
.tut .ts { font-size: 13px; color: var(--muted); }
.tut .tp { display: flex; gap: 4px; margin-top: 6px; }
.tut .tp i { width: 18px; height: 5px; border-radius: 3px; background: #333; }
.tut .tp i.on { background: var(--gold); }
.tut .tbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
@media (max-height: 500px) { .tut { top: 54px; padding: 6px 10px; } .tut .pic { font-size: 30px; } .tut .tt { font-size: 14px; } .tut .ts { font-size: 11px; } }
.tile.glow { box-shadow: 0 0 0 2px var(--gold), 0 0 24px rgba(212,165,44,.45); }
</style>
