name: LIVING AI (Android)

on:
  push:
    paths:
      - 'living-ai/**'
      - '.github/workflows/living-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-ai-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: living-ai

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (agents, safety, redaction)
        run: ./gradlew :core:test --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: living-ai-debug-apk
          path: living-ai/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            living-ai/core/build/reports/tests
            living-ai/app/build/reports
          if-no-files-found: ignore

  device-tests:
    name: Android 16 emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          working-directory: living-ai
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            living-ai/app/build/reports/androidTests
            living-ai/app/build/outputs/androidTest-results
          if-no-files-found: ignore
