name: LIVING AI (Android)

on:
  push:
    paths:
      - 'living-ai/**'
      - '.github/workflows/living-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-ai-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: living-ai

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # publish the APK as a release asset (direct download link)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (agents, safety, redaction)
        run: ./gradlew :core:test || ./gradlew :core:test  # retry once: Maven Central is occasionally flaky
      - name: Build APKs (debug for tests, release for installing)
        run: ./gradlew :app:assembleDebug :app:assembleRelease || ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: living-ai-apk
          path: living-ai/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish APK as a pre-release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk living-ai.apk
          cp app/build/outputs/apk/release/app-release.apk "kivo-$VERSION.apk"
          gh release delete living-ai-latest --cleanup-tag --yes || true
          gh release create living-ai-latest living-ai.apk "kivo-$VERSION.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Kivo $VERSION" \
            --notes "เวอร์ชัน $VERSION — ดาวน์โหลด kivo-$VERSION.apk (หรือ living-ai.apk ซึ่งเป็นไฟล์เดียวกัน) แล้วแตะเพื่อติดตั้งทับของเดิม ดูเลขเวอร์ชันได้ข้างชื่อ Kivo ในหน้าแรกของแอป (สร้างจาก $GITHUB_SHA)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            living-ai/core/build/reports/tests
            living-ai/app/build/reports
          if-no-files-found: ignore
      - name: Probe model and library sources (information only)
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          for r in Qwen/Qwen2.5-0.5B-Instruct-GGUF Qwen/Qwen2.5-1.5B-Instruct-GGUF; do
            echo "== $r"
            curl -sS -m 30 "https://huggingface.co/api/models/$r/tree/main" | python3 -c "import sys,json; [print(f['path'], f.get('size'), (f.get('lfs') or {}).get('oid','')) for f in json.load(sys.stdin) if 'q4' in f['path'].lower() or 'LICENSE' in f['path']]" || true
          done
          for u in https://jitpack.io/cz/adaptech/tesseract4android/tesseract4android/4.7.0/tesseract4android-4.7.0.pom https://jitpack.io/cz/adaptech/tesseract4android/tesseract4android/4.9.0/tesseract4android-4.9.0.pom https://jitpack.io/com/github/adaptech-cz/Tesseract4Android/4.7.0/Tesseract4Android-4.7.0.pom; do
            echo "$(curl -sS -o /dev/null -w '%{http_code}' -m 120 -L "$u") $u"
          done
          curl -sS -m 30 https://jitpack.io/api/builds/com.github.adaptech-cz/Tesseract4Android | head -c 600 || true
          echo; ls "$ANDROID_HOME/ndk" 2>/dev/null; ls "$ANDROID_HOME/cmake" 2>/dev/null; nproc; free -g | sed -n 2p

  device-tests:
    name: Android 16 emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          working-directory: living-ai
          script: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest || ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest; ./gradlew :app:connectedDebugAndroidTest
      - name: Device test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          print('result files:', len(files))
          for f in files:
              for case in ET.parse(f).getroot().iter('testcase'):
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  skipped = any(c.tag == 'skipped' for c in case)
                  print(('FAIL ' if bad else 'SKIP ' if skipped else 'PASS ') + case.get('name'))
                  for b in bad:
                      print('    ' + (b.text or b.get('message') or '').strip()[:1500].replace('\n', '\n    '))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            living-ai/app/build/reports/androidTests
            living-ai/app/build/outputs/androidTest-results
          if-no-files-found: ignore
