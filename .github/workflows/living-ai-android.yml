name: LIVING AI (Android)

on:
  push:
    paths:
      - 'living-ai/**'
      - '.github/workflows/living-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-ai-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: living-ai

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # publish the APK as a release asset (direct download link)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Get llama.cpp (pinned) and build the native engine for this machine
        run: |
          TAG=$(sed -n 's/^set(LLAMA_TAG "\(.*\)")/\1/p' app/src/main/cpp/CMakeLists.txt)
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S app/src/main/cpp -B "$RUNNER_TEMP/native-host" -DLLAMA_DIR="$RUNNER_TEMP/llama.cpp" -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build "$RUNNER_TEMP/native-host" -j"$(nproc)" --target kivo_llama | tail -3
          pip install --quiet numpy
          python3 scripts/make_tiny_gguf.py "$RUNNER_TEMP/llama.cpp" "$RUNNER_TEMP/tiny.gguf"
      - name: Cache the real test model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: qwen2.5-0.5b-instruct-q4_k_m-74a4da8c
      - name: Download the real model (Qwen2.5 0.5B, Apache-2.0) for the quality test
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/models"; cd "$RUNNER_TEMP/models"
          F=qwen2.5-0.5b-instruct-q4_k_m.gguf
          [ -f "$F" ] || curl -sSL --retry 3 -m 600 -o "$F" "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/$F"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $F" | sha256sum -c - || rm -f "$F"
      - name: Unit tests (core, native engine with tiny model, real model if downloaded)
        run: |
          ARGS="-PllamaLib=$RUNNER_TEMP/native-host/libkivo_llama.so -PtinyModel=$RUNNER_TEMP/tiny.gguf"
          [ -f "$RUNNER_TEMP/models/qwen2.5-0.5b-instruct-q4_k_m.gguf" ] && ARGS="$ARGS -PrealModel=$RUNNER_TEMP/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          (./gradlew :core:test $ARGS || ./gradlew :core:test $ARGS) 2>&1 | tee "$RUNNER_TEMP/core-test.log" | grep -v -E "^(llama|ggml|graph_compute|process_ubatch)" | tail -150
          exit ${PIPESTATUS[0]}
      - name: Build APKs (debug for tests, release for installing)
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PllamaDir="$RUNNER_TEMP/llama.cpp" || ./gradlew :app:assembleDebug :app:assembleRelease -PllamaDir="$RUNNER_TEMP/llama.cpp"
      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: living-ai-apk
          path: living-ai/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish APK as a pre-release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk living-ai.apk
          cp app/build/outputs/apk/release/app-release.apk "kivo-$VERSION.apk"
          gh release delete living-ai-latest --cleanup-tag --yes || true
          gh release create living-ai-latest living-ai.apk "kivo-$VERSION.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Kivo $VERSION" \
            --notes "เวอร์ชัน $VERSION — ดาวน์โหลด kivo-$VERSION.apk (หรือ living-ai.apk ซึ่งเป็นไฟล์เดียวกัน) แล้วแตะเพื่อติดตั้งทับของเดิม ดูเลขเวอร์ชันได้ข้างชื่อ Kivo ในหน้าแรกของแอป (สร้างจาก $GITHUB_SHA)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            living-ai/core/build/reports/tests
            living-ai/app/build/reports
          if-no-files-found: ignore
      - name: Report (read from the end of the log)
        if: always()
        continue-on-error: true
        run: |
          echo "== core tests"
          python3 - <<'PY'
          import glob, re
          t = f = sk = 0
          for x in glob.glob('core/build/test-results/test/*.xml'):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(x).read())
              t += int(m[1]); sk += int(m[2]); f += int(m[3]) + int(m[4])
          print('tests', t, 'skipped', sk, 'failed', f)
          PY
          echo "== real model on the CI machine ($(nproc) cores; a phone is slower)"
          grep "REAL-MODEL" "$RUNNER_TEMP/core-test.log" || echo "real model test did not run"
          echo "== APK"
          ls -l app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "\.so$|tessdata" || true

  device-tests:
    name: Android 16 emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Get llama.cpp (pinned) and make the tiny test model
        run: |
          TAG=$(sed -n 's/^set(LLAMA_TAG "\(.*\)")/\1/p' app/src/main/cpp/CMakeLists.txt)
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          pip install --quiet numpy
          python3 scripts/make_tiny_gguf.py "$RUNNER_TEMP/llama.cpp" "$RUNNER_TEMP/tiny.gguf"
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          working-directory: living-ai
          script: |
            adb push "$RUNNER_TEMP/tiny.gguf" /data/local/tmp/kivo-tiny.gguf
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -PllamaDir="$RUNNER_TEMP/llama.cpp" || ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -PllamaDir="$RUNNER_TEMP/llama.cpp"
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -PllamaDir="$RUNNER_TEMP/llama.cpp"
      - name: Device test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          print('result files:', len(files))
          for f in files:
              for case in ET.parse(f).getroot().iter('testcase'):
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  skipped = any(c.tag == 'skipped' for c in case)
                  print(('FAIL ' if bad else 'SKIP ' if skipped else 'PASS ') + case.get('name'))
                  for b in bad:
                      print('    ' + (b.text or b.get('message') or '').strip()[:1500].replace('\n', '\n    '))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            living-ai/app/build/reports/androidTests
            living-ai/app/build/outputs/androidTest-results
          if-no-files-found: ignore
